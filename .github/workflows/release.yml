name: Release a skill group

# Runs automatically for tags like  learning--v1.2.0  (created by scripts/release.py).
# Can also be run by hand from the Actions tab for an existing tag.
# Publishes a GitHub Release with one .zip per skill in that group.
on:
  push:
    tags: ["*--v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. learning--v1.0.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Parse tag
        id: tag
        run: |
          case "$TAG" in
            *--v*) ;;
            *) echo "::error::'$TAG' is not a <group>--v<version> tag"; exit 1 ;;
          esac
          echo "group=${TAG%%--v*}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG##*--v}" >> "$GITHUB_OUTPUT"

      - name: Check tag matches the group's version
        run: |
          ACTUAL=$(python -c "import json;print(json.load(open('plugins/${{ steps.tag.outputs.group }}/plugin.json'))['version'])")
          if [ "$ACTUAL" != "${{ steps.tag.outputs.version }}" ]; then
            echo "::error::Tag says ${{ steps.tag.outputs.version }} but plugin.json says $ACTUAL"; exit 1
          fi

      - run: python scripts/validate_skills.py
      - run: python scripts/package_skills.py --group ${{ steps.tag.outputs.group }}

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ steps.tag.outputs.group }} v${{ steps.tag.outputs.version }}
          files: dist/*.zip
          generate_release_notes: true
